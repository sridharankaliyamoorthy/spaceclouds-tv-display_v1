<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mockup: QR Code Integration</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      font-family: 'Arial', sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }
    .screen {
      width: 1920px;
      height: 1080px;
      background: url('../dummy_assets_for_mock_up/BG.jpg') center/cover;
      position: relative;
      transform: scale(0.5);
      transform-origin: center;
    }
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,0.4), rgba(0,0,0,0.7));
    }
    .content {
      position: relative;
      z-index: 10;
      padding: 80px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .top-section {
      text-align: center;
    }
    .top-section h1 {
      font-size: 120px;
      font-weight: bold;
      margin-bottom: 30px;
      text-shadow: 0 4px 20px rgba(0,0,0,0.5);
      background: linear-gradient(45deg, #ffd700, #ffed4e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .top-section p {
      font-size: 60px;
      color: #fff;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }
    .qr-section {
      display: flex;
      justify-content: space-around;
      align-items: center;
      gap: 60px;
    }
    .qr-card {
      background: rgba(255, 255, 255, 0.95);
      padding: 50px;
      border-radius: 30px;
      text-align: center;
      box-shadow: 0 10px 50px rgba(0,0,0,0.5);
      flex: 1;
    }
    .qr-code {
      width: 280px;
      height: 280px;
      background: white;
      margin: 0 auto 30px;
      border: 4px solid #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: #666;
    }
    .qr-card h3 {
      font-size: 48px;
      color: #1a1a2e;
      margin-bottom: 15px;
    }
    .qr-card p {
      font-size: 32px;
      color: #666;
    }
    .note {
      text-align: center;
      font-size: 28px;
      color: rgba(255,255,255,0.7);
      margin-top: 30px;
    }
  </style>
</head>
<body>
  <div class="screen">
    <div class="overlay"></div>
    <div class="content">
      <div class="top-section">
        <h1>HAPPY HOUR</h1>
        <p>$5 Signature Cocktails • 5-7 PM Daily</p>
      </div>
      
      <div class="qr-section">
        <div class="qr-card">
          <div class="qr-code">QR CODE<br>MENU</div>
          <h3>View Full Menu</h3>
          <p>menusa.app/spaceclouds</p>
        </div>
        
        <div class="qr-card">
          <div class="qr-code">QR CODE<br>INSTAGRAM</div>
          <h3>Follow Us</h3>
          <p>@spaceclouds.prague</p>
        </div>
        
        <div class="qr-card">
          <div class="qr-code">QR CODE<br>WEBSITE</div>
          <h3>Visit Us Online</h3>
          <p>spaceclouds.cz</p>
        </div>
      </div>
      
      <div class="note">
        📱 Scan any QR code with your phone camera
      </div>
    </div>
  </div>
</body>
</html>
