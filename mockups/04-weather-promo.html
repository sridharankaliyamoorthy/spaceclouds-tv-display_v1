<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mockup: Weather-Based Promos</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      font-family: 'Arial', sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }
    .screen {
      width: 1920px;
      height: 1080px;
      background: linear-gradient(to bottom, #4facfe 0%, #00f2fe 100%);
      position: relative;
      transform: scale(0.5);
      transform-origin: center;
      overflow: hidden;
    }
    .rain {
      position: absolute;
      top: -20px;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(transparent 0%, rgba(255,255,255,0.3) 100%);
      animation: rain 1s linear infinite;
    }
    @keyframes rain {
      0% { background-position: 0 0; }
      100% { background-position: 0 100px; }
    }
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.3);
    }
    .content {
      position: relative;
      z-index: 10;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 80px;
    }
    .weather-icon {
      font-size: 250px;
      margin-bottom: 40px;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }
    .weather-text {
      font-size: 80px;
      margin-bottom: 60px;
      opacity: 0.9;
    }
    .promo-box {
      background: rgba(255,255,255,0.95);
      padding: 80px 120px;
      border-radius: 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
      max-width: 1400px;
    }
    .promo-box h1 {
      font-size: 140px;
      color: #ff6b6b;
      margin-bottom: 30px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
    }
    .promo-box h2 {
      font-size: 90px;
      color: #333;
      margin-bottom: 40px;
    }
    .promo-box p {
      font-size: 60px;
      color: #666;
      line-height: 1.4;
    }
    .price {
      display: inline-block;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px 50px;
      border-radius: 20px;
      font-size: 80px;
      font-weight: bold;
      margin: 30px 0;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .drinks {
      display: flex;
      justify-content: center;
      gap: 60px;
      margin-top: 50px;
    }
    .drink-card {
      background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
      padding: 40px;
      border-radius: 25px;
      color: #333;
    }
    .drink-card .emoji {
      font-size: 100px;
      margin-bottom: 15px;
    }
    .drink-card .name {
      font-size: 50px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="screen">
    <div class="rain"></div>
    <div class="overlay"></div>
    <div class="content">
      <div class="weather-icon">🌧️</div>
      <div class="weather-text">It's Rainy Outside...</div>
      
      <div class="promo-box">
        <h1>Warm Up Special!</h1>
        <h2>Hot Signature Cocktails</h2>
        <div class="price">150 Kč Today Only</div>
        <p>Because nobody should face the rain without<br>a little warmth inside</p>
        
        <div class="drinks">
          <div class="drink-card">
            <div class="emoji">🍎</div>
            <div class="name">Hot Apple Pie</div>
          </div>
          <div class="drink-card">
            <div class="emoji">☕</div>
            <div class="name">Irish Coffee</div>
          </div>
          <div class="drink-card">
            <div class="emoji">🍵</div>
            <div class="name">Hot Toddy</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
