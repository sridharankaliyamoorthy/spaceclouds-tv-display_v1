<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Space Clouds - Center Screen</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body,
    html {
      background: #000;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: translateZ(0);
      -webkit-transform: translateZ(0);
    }
  </style>
</head>

<body onclick="handleClick()">
  <div class="slideshow-container">
    <video id="video1" class="slide active" muted playsinline autoplay preload="auto" webkit-playsinline="true"
      x-webkit-airplay="allow">
      <source src="" type="video/mp4" />
    </video>
    <video id="video2" class="slide" muted playsinline preload="auto" webkit-playsinline="true"
      x-webkit-airplay="allow">
      <source src="" type="video/mp4" />
    </video>
  </div>

  <script>
    const video1 = document.getElementById("video1");
    const video2 = document.getElementById("video2");
    const videoSources = [
      "screens/center/Logo_animation_lg.mp4",
      "screens/center/Mystery_shot_lg.mp4"
    ];

    let currentVideoIndex = 0;
    let activePlayer = video1;
    let nextPlayer = video2;
    let isTransitioning = false;

    function init() {
      // Setup initial state
      video1.src = videoSources[0];
      video2.src = videoSources[1]; // Preload next

      video1.load();
      video2.load();

      // Attempt to play first one
      playVideo(video1);
    }

    function playVideo(player) {
      const playPromise = player.play();
      if (playPromise !== undefined) {
        playPromise.catch(error => {
          console.log("Play failed (interrupted or hidden):", error);
          // If play fails, we might need manual interaction or it will retry on click
        });
      }
    }

    function swapVideos() {
      if (isTransitioning) return;
      isTransitioning = true;

      // Calculate next index
      const nextIndex = (currentVideoIndex + 1) % videoSources.length;
      const futureIndex = (nextIndex + 1) % videoSources.length;

      // Play next video immediately
      nextPlayer.play().then(() => {
        // Wait for connection to actually have a frame ready
        const onFrameReady = () => {
          if (nextPlayer.currentTime > 0) {
            nextPlayer.removeEventListener('timeupdate', onFrameReady);

            // Fade in next player NOW that we know it has data
            nextPlayer.classList.add('active');

            // Wait for CSS transition (1s)
            setTimeout(() => {
              // Cleanup old active player
              activePlayer.classList.remove('active');
              activePlayer.pause();
              activePlayer.currentTime = 0;

              // Prepare for FUTURE
              activePlayer.src = videoSources[futureIndex];
              activePlayer.load();

              // Swap references
              [activePlayer, nextPlayer] = [nextPlayer, activePlayer];
              currentVideoIndex = nextIndex;

              isTransitioning = false;
            }, 1000);
          }
        };

        nextPlayer.addEventListener('timeupdate', onFrameReady);

      }).catch(e => {
        console.error("Next video failed to play:", e);
        isTransitioning = false;
        setTimeout(swapVideos, 2000);
      });
    }

    // Attach listeners
    [video1, video2].forEach(player => {
      // Use 'ended' to trigger swap
      player.addEventListener('ended', () => {
        if (player === activePlayer && !isTransitioning) {
          swapVideos();
        }
      });

      // Error recovery
      player.addEventListener('error', (e) => {
        console.error("Video Error:", e);
        if (player === activePlayer) {
          // If active player errors, try to skip
          swapVideos();
        }
      });
    });

    // Visibility API Implementation
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        // Optional: pause? No, let it run/buffer.
      } else {
        // Wake up if paused strangely
        if (activePlayer.paused && !isTransitioning) {
          playVideo(activePlayer);
        }
      }
    });

    // Watchdog to prevent unexpected stops
    setInterval(() => {
      // 1. If transitioning too long, force reset
      if (isTransitioning) {
        // We rely on the swapVideos timeout (1s) to clear it. 
        // If it's still true after 3s, something broke.
        // But we don't track start time here. 
        // Let's just ensure activePlayer is playing if not transitioning.
      }

      // 2. Check if stuck here
      if (!isTransitioning && activePlayer.paused && !document.hidden) {
        console.log("Watchdog: Video shouldn't be paused. Kicking...");
        playVideo(activePlayer);
      }
    }, 2000);

    // Click handler for fullscreen and ensuring playback
    function handleClick() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          console.log("Fullscreen error:", err);
        });
      }

      // Only attempt to play if we are NOT transitioning and it's paused.
      // If we are transitioning, let the logic handle it to avoid "stops on click" glitches
      if (!isTransitioning && activePlayer.paused) {
        playVideo(activePlayer);
      }
    }

    window.addEventListener("load", init);

  </script>
</body>

</html>
