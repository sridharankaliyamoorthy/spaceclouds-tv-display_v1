<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Space Clouds - Center Screen</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body,
    html {
      background: #000;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: translateZ(0);
      -webkit-transform: translateZ(0);
    }
  </style>
</head>

<body onclick="toggleFullScreen()">
  <div class="slideshow-container">
    <video id="video1" class="slide active" muted playsinline autoplay preload="auto" webkit-playsinline="true"
      x-webkit-airplay="allow">
      <source src="" type="video/mp4" />
    </video>
    <video id="video2" class="slide" muted playsinline preload="auto" webkit-playsinline="true"
      x-webkit-airplay="allow">
      <source src="" type="video/mp4" />
    </video>
  </div>

  <script>
    const video1 = document.getElementById("video1");
    const video2 = document.getElementById("video2");
    const videoSources = [
      "screens/center/Logo_animation_lg.mp4",
      "screens/center/Mystery_shot_lg.mp4"
    ];

    let currentVideoIndex = 0;
    let activePlayer = video1;
    let nextPlayer = video2;

    function init() {
      // Setup initial state
      video1.src = videoSources[0];
      video2.src = videoSources[1]; // Preload next

      // Load both
      video1.load();
      video2.load();

      // Attempt to play first one
      const playPromise = video1.play();
      if (playPromise !== undefined) {
        playPromise.catch(error => {
          console.log("Autoplay prevented:", error);
        });
      }
    }

    function swapVideos() {
      // Calculate next index
      const nextIndex = (currentVideoIndex + 1) % videoSources.length;

      // Update next player's source if needed (buffer ahead)
      // In this 2-video loop, they are already set correctly if we swap carefully, 
      // but for generic N videos:
      const futureIndex = (nextIndex + 1) % videoSources.length;

      // Start playing the next video (it's behind the active one, or opacity 0)
      nextPlayer.play().then(() => {
        // Fade in next player
        nextPlayer.classList.add('active');
        // Fade out active player (after transition finishes or concurrently)
        // Since active is top, fading OUT active reveals next? 
        // Or fading IN next (if z-index matches) covers active?
        // With default CSS, everything absolute. Last in DOM is on top. 
        // Let's rely on class toggling. The 'active' class has opacity 1. 
        // We want the ONE coming in to become opacity 1.
        // If we just toggle 'active' on nextPlayer, it fades in.

        // Wait for transition to complete before resetting the old one
        setTimeout(() => {
          activePlayer.classList.remove('active');
          activePlayer.pause();
          activePlayer.currentTime = 0;

          // Prepare old active player for its NEXT turn
          activePlayer.src = videoSources[futureIndex];
          activePlayer.load();

          // Swap references
          [activePlayer, nextPlayer] = [nextPlayer, activePlayer];
          currentVideoIndex = nextIndex;
        }, 1000); // 1s matches CSS transition duration

      }).catch(e => console.error("Next video play failed", e));
    }

    // Attach listeners to both players
    [video1, video2].forEach(player => {
      // Trigger swap slightly before end for smoother feel? 
      // Or just 'ended' is fine with a crossfade. 
      // 'ended' event means the current video stopped. 
      // If we wait for 'ended', there will be a freeze frame while next fades in.
      // Better to trigger ON 'ended' but have the next one start immediately.
      // The freeze frame of 'ended' video will be covered by the fading-in next video.
      player.addEventListener('ended', () => {
        // Only swap if this player is currently the active one
        if (player === activePlayer) {
          swapVideos();
        }
      });

      // Ensure visibility recovery
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden && player.paused && player.classList.contains('active')) {
          player.play();
        }
      });
    });

    // Global click to start/fullscreen
    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          console.log("Fullscreen error:", err);
        });
      }
      if (activePlayer.paused) activePlayer.play();
    }

    window.addEventListener("load", init);

  </script>
</body>

</html>
