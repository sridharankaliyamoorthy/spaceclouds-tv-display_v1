<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Space Clouds - Center Screen</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body,
    html {
      background: #000;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    .video-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #000;
    }

    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: translateZ(0); /* Hardware acceleration */
      -webkit-transform: translateZ(0);
    }
  </style>
</head>

<body onclick="toggleFullScreen()">
  <div class="video-container">
    <video id="video-player" autoplay muted playsinline preload="auto" webkit-playsinline="true" x-webkit-airplay="allow">
      <source src="screens/center/v003/HK_Center_03_final.mp4" type="video/mp4" />
    </video>
  </div>

  <script>
    const video = document.getElementById("video-player");
    const VIDEO_DURATION = 17.000; // Exact length of our perfectly synced video

    // Start the video on load
    window.addEventListener("load", () => {
      video.play().catch(e => console.log("Waiting for user interaction", e));
      // Start the master synchronization global loop
      setInterval(syncToGlobalClock, 250);
    });

    // The Master Global Clock Sync Function
    // Forces the three independent smart TVs to align their playback position to the absolute real-world time.
    function syncToGlobalClock() {
      if (!video.duration || video.paused) return; // Do not interrupt if not ready

      // Calculate the global timeline position, modulo 17 seconds
      const nowInSeconds = Date.now() / 1000;
      const expectedTimelineTarget = nowInSeconds % VIDEO_DURATION;

      // How far off is this TV from the absolute timeline?
      const drift = Math.abs(video.currentTime - expectedTimelineTarget);

      // WebOS seeking is computationally heavy relative to playback.
      // Force an explicit seek alignment ONLY if the screen is visibly drifting apart (>0.30 seconds off)
      // We also ignore the extreme loop boundaries (<0.5, >16.5) to avoid fighting the natural loop reset
      if (drift > 0.30 && drift < (VIDEO_DURATION - 0.5)) {
        console.log(`Syncing Screen: Drift detected at ${drift.toFixed(2)}s`);
        video.currentTime = expectedTimelineTarget;
      }
    }

    // --- ZERO-TOUCH REMOTE UPDATE POLLER ---
    // The TV secretly checks GitHub version.json every 3 minutes. 
    // If you bump the version, it completely refreshes the browser autonomously!
    const CURRENT_DEPLOYMENT_VERSION = 1;
    setInterval(() => {
      fetch(`version.json?t=${Date.now()}`)
        .then(response => response.json())
        .then(data => {
          if (data.version > CURRENT_DEPLOYMENT_VERSION) {
            console.log("New video deployment detected! Rebooting screen natively...");
            window.location.reload(true);
          }
        })
        .catch(err => console.log("Update check failed (Normal if offline):", err));
    }, 180000); // 180,000ms = 3 minutes

    // MANUALLY LOOP THE VIDEO to prevent LG TV memory leaks, safely aligning it to the global clock start boundary.
    video.addEventListener('ended', () => {
      // Upon hardware video 'ended', recalculate perfect start time rather than blindly jumping to 0.1
      const nowInSeconds = Date.now() / 1000;
      video.currentTime = nowInSeconds % VIDEO_DURATION;
      video.play().catch(e => console.log("Play failed", e));

      // Log successful loop completion to telemetry
      sendTelemetry('LoopEnd');
    });

    // Ensure video plays on any user interaction
    document.body.addEventListener('click', () => {
      if (video.paused) {
        video.play();
      }
    });

    // Resume on visibility change (wake from sleep)
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && video.paused) {
        video.play();
      }
    });

    // --- MR. ROOT TELEMETRY HUB ---
    // Real-time tracking for the glassmorphic Command Center.
    const SB_URL = 'https://lvlntilkvcmenzjyehng.supabase.co'; 
    const SB_KEY = 'sb_publishable_sXwfUaWk9W8RpmUfHcdlBw_aD8hjRUj';
    const SCREEN_ID = 'Center'; 
    const VERSION = CURRENT_DEPLOYMENT_VERSION;

    function sendTelemetry(eventType) {
      if (!SB_URL || SB_URL.includes('YOUR_SUPABASE')) return;
      
      const TELEMETRY_ENDPOINT = `${SB_URL}/rest/v1/telemetry`;
      const data = { screen_id: SCREEN_ID, event_type: eventType, version: VERSION };
      
      const headers = {
        'Content-Type': 'application/json',
        'apikey': SB_KEY,
        'Authorization': `Bearer ${SB_KEY}`
      };

      if (navigator.sendBeacon) {
        navigator.sendBeacon(TELEMETRY_ENDPOINT, JSON.stringify(data));
      } else {
        fetch(TELEMETRY_ENDPOINT, { method: 'POST', headers: headers, body: JSON.stringify(data) }).catch(() => {});
      }
    }

    // Initial Uptime Pulse & 10-Minute Heartbeat
    window.addEventListener('load', () => sendTelemetry('InitialBoot'));
    setInterval(() => sendTelemetry('Heartbeat'), 600000); 

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch((err) => {
          console.log(`Error: ${err.message}`);
        });
      }
    }
  </script>
</body>
</html>
