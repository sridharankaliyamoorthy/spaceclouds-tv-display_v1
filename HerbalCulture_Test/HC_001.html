<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Herbal Culture - New Test Screen</title>
  <style>
    body,
    html {
      background: #000;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 1920px;
      height: 1080px;
      object-fit: fill;
      transform: translateZ(0);
      -webkit-transform: translateZ(0);
    }
  </style>
</head>

<body onclick="toggleFullScreen()">
  <div class="slideshow-container">
    <video id="video-slide" muted playsinline loop autoplay preload="auto" webkit-playsinline="true"
      x-webkit-airplay="allow">
      <source src="Assets/hf_20260411_211038_f1f868aa-dc28-4558-886f-2ee54572a4c9_baseline.mp4" type="video/mp4" />
      Your browser does not support the video tag.
    </video>
  </div>

  <script>
    const video = document.getElementById("video-slide");

    // Start playback on load
    window.addEventListener("load", () => {
      video.play().catch((e) => console.log("Waiting for user interaction"));
    });

    // Ensure video plays on any user interaction
    document.body.addEventListener('click', () => {
      if (video.paused) {
        video.play();
      }
    });

    // Resume on visibility change (wake from sleep)
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && video.paused) {
        video.play();
      }
    });

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch((err) => {
          console.log(`Error: ${err.message}`);
        });
      }
    }

    // --- MR. ROOT TELEMETRY HUB ---
    // Real-time tracking for the glassmorphic Command Center.
    const SB_URL = 'https://lvlntilkvcmenzjyehng.supabase.co'; 
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx2bG50aWxrdmNtZW56anllaG5nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ3MjIxMzIsImV4cCI6MjA5MDI5ODEzMn0.jEOEEqRTKex4QuPPUwfXHryAwxg0otZkUioWSyQTcZU';
    const SCREEN_ID = 'HotSeat'; 
    const VERSION = 1;

    function sendTelemetry(eventType) {
      if (!SB_URL || SB_URL.includes('YOUR_SUPABASE')) return;
      
      const TELEMETRY_ENDPOINT = `${SB_URL}/rest/v1/telemetry`;
      const data = { screen_id: SCREEN_ID, event_type: eventType, version: VERSION };
      
      const headers = {
        'Content-Type': 'application/json',
        'apikey': SB_KEY,
        'Authorization': `Bearer ${SB_KEY}`
      };

      if (navigator.sendBeacon) {
        navigator.sendBeacon(TELEMETRY_ENDPOINT, JSON.stringify(data));
      } else {
        fetch(TELEMETRY_ENDPOINT, { method: 'POST', headers: headers, body: JSON.stringify(data) }).catch(() => {});
      }
    }

    // Initial Uptime Pulse & 10-Minute Heartbeat
    window.addEventListener('load', () => sendTelemetry('InitialBoot'));
    setInterval(() => sendTelemetry('Heartbeat'), 600000); 

    // Log successful loop completion to telemetry
    video.addEventListener('ended', () => {
      sendTelemetry('LoopEnd');
    });
  </script>
</body>

</html>
