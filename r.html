<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Space Clouds - Right Screen</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      body,
      html {
        background: #000;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      .video-container {
        position: relative;
        width: 100vw;
        height: 100vh;
        background: #000;
      }
      video {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: translateZ(0); /* Hardware acceleration */
        -webkit-transform: translateZ(0);
      }
    </style>
  </head>
  <body onclick="toggleFullScreen()">
    <div class="video-container">
      <video id="video-player" autoplay muted playsinline preload="auto" webkit-playsinline="true" x-webkit-airplay="allow">
        <source src="screens/right/V003/HK_Lt_03_final.mp4" type="video/mp4" />
      </video>
    </div>

    <script>
      const video = document.getElementById("video-player");

      // Start the video
      video.play().catch(e => console.log("Waiting for user interaction", e));
      window.addEventListener("load", () => {
        video.play().catch(e => console.log("Waiting for user interaction", e));
      });

      // MANUALLY LOOP THE VIDEO to prevent LG TV memory leaks. 
      // Do not use the HTML5 'loop' attribute on WebOS.
      video.addEventListener('ended', () => {
        video.currentTime = 0.1; // Reset to start
        video.play().catch(e => console.log("Play failed", e));
      });

      // Ensure video plays on any user interaction
      document.body.addEventListener('click', () => {
        if (video.paused) {
          video.play();
        }
      });

      // Resume on visibility change (wake from sleep)
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden && video.paused) {
          video.play();
        }
      });

      function toggleFullScreen() {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch((err) => {
            console.log(`Error: ${err.message}`);
          });
        }
      }
    </script>
  </body>
</html>
