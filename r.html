<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Space Clouds - Right Screen</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body,
    html {
      background: #000;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    .screen-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #000;
    }

    .screen-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
</head>

<body onclick="toggleFullScreen()">
  <div class="screen-container">
    <img class="screen-image" src="screens/Logo%20Gastro.PNG" alt="Gastro screen" />
  </div>

  <script>
    window.addEventListener("load", () => {
      // Hourly Watchdog Sync: Softly reloads the entire page exactly at the top of the hour
      // Ensures long-term synchronization across all 3 screens without causing mid-video lag
      setInterval(() => {
        const d = new Date();
        if (d.getMinutes() === 0 && d.getSeconds() === 0) {
          console.log("Hourly exact lock - Realignment reload!");
          window.location.reload(true);
        }
      }, 1000); // Check every second
    });

    // --- ZERO-TOUCH REMOTE UPDATE POLLER ---
    // The TV secretly checks GitHub version.json every 3 minutes.
    const CURRENT_DEPLOYMENT_VERSION = 10;
    setInterval(() => {
      fetch(`version.json?t=${Date.now()}`)
        .then(response => response.json())
        .then(data => {
          if (data.version > CURRENT_DEPLOYMENT_VERSION) {
            console.log("New video deployment detected! Rebooting screen natively...");
            window.location.reload(true);
          }
        })
        .catch(err => console.log("Update check failed (Normal if offline):", err));
    }, 180000); // 180,000ms = 3 minutes

    // --- MR. ROOT TELEMETRY HUB ---
    const SB_URL = 'https://lvlntilkvcmenzjyehng.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx2bG50aWxrdmNtZW56anllaG5nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ3MjIxMzIsImV4cCI6MjA5MDI5ODEzMn0.jEOEEqRTKex4QuPPUwfXHryAwxg0otZkUioWSyQTcZU';
    const SCREEN_ID = 'Right';
    const VERSION = CURRENT_DEPLOYMENT_VERSION;

    function sendTelemetry(eventType) {
      if (!SB_URL || SB_URL.includes('YOUR_SUPABASE')) return;

      const TELEMETRY_ENDPOINT = `${SB_URL}/rest/v1/telemetry`;
      const data = { screen_id: SCREEN_ID, event_type: eventType, version: VERSION };

      fetch(TELEMETRY_ENDPOINT, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SB_KEY,
          'Authorization': `Bearer ${SB_KEY}`
        },
        body: JSON.stringify(data),
        keepalive: true
      }).catch(() => { });
    }

    // Initial Uptime Pulse & 10-Minute Heartbeat
    window.addEventListener('load', () => sendTelemetry('InitialBoot'));
    setInterval(() => sendTelemetry('Heartbeat'), 600000);

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch((err) => {
          console.log(`Error: ${err.message}`);
        });
      }
    }
  </script>
</body>

</html>
